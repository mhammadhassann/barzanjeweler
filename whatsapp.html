<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover to Show WhatsApp Number</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .whatsapp-link-container {
            display: flex;
            gap: 40px;
            align-items: center;
            justify-content: center;
        }
        .whatsapp-link {
            position: relative;
            font-size: 20px;
            text-decoration: none;
            color: #25D366;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        .whatsapp-link:hover {
            color: #128C7E;
        }
        .whatsapp-number {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #128C7E;
            color: white;
            font-size: 16px;
            padding: 8px 15px;
            border-radius: 5px;
            margin-top: 5px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .whatsapp-link:hover .whatsapp-number {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>

    <div class="whatsapp-link-container">
        <a href="https://wa.me/+9647504452912" target="_blank" class="whatsapp-link">
            Shahin
            <div class="whatsapp-number">0750 445 2912</div>
        </a>
        <a href="https://wa.me/+9647504475644" target="_blank" class="whatsapp-link">
          Barzan
            <div class="whatsapp-number">0750 447 5644</div>
        </a>
    </div>

</body>
</html>
